[project]
name = "namma-space-iitb"
version = "1.0.0"
description = "Smartphone capture to indoor digital twin"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av>=18.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "scipy>=1.14,<2",
    "plyfile>=1.1,<2",
    "pillow>=10",
    "torch>=2.14.1,<3",
    "torchvision>=0.29.1",
    "gsplat==1.5.3",
    "pycolmap>=4.2",
    "lightglue",
    "transformers>=5.20.2",
    "lpips>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
namma-preprocess = "src.preprocessing.cli:main"
namma-reconstruct = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["cuda: real gsplat rendering/training tests requiring CUDA on the development server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
lightglue = { git = "https://github.com/cvg/LightGlue" }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
