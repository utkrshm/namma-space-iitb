[project]
name = "namma-space-iitb"
version = "0.1.0"
description = "Smartphone capture to indoor digital twin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=18.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
namma-preprocess = "src.preprocessing.cli:main"
namma-splat = "src.splatting.cli:main"
namma-render-splat = "src.rendering.cli:main"
namma-view-splat = "src.splatting.viewer:main"

[project.optional-dependencies]
splatting = [
    "gsplat==1.5.3",
    "torch>=2.4,<3",
    "scipy>=1.14,<2",
    "plyfile>=1.1,<2",
]
splatting-viewer = [
    "namma-space-iitb[splatting]",
    "viser>=1.0,<2",
]
revisits = [
    "lightglue",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: real gsplat rendering/training tests requiring CUDA on the development server"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
lightglue = { git = "https://github.com/cvg/LightGlue" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
