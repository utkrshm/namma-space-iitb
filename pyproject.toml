[project]
name = "namma-space-iitb"
version = "0.1.0"
description = "Smartphone capture to indoor digital twin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=18.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
namma-preprocess = "src.preprocessing.cli:main"
namma-reconstruct = "src.reconstruction.cli:main"
namma-refine = "src.refinement.cli:main"

[project.optional-dependencies]
alignment = [
    "scipy>=1.14",
]
floor = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
]
reconstruction = [
    "einops>=0.8",
    "huggingface-hub>=0.34",
    "pillow>=10",
    "safetensors>=0.5",
    "torch>=2.14.1",
]
viewer = [
    "open3d>=0.19",
]
revisits = [
    "lightglue",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
]
refinement = [
    "kornia>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
lightglue = { git = "https://github.com/cvg/LightGlue" }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
