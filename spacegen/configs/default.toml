# spacegen defaults, generated by scripts/write_default_config.py.

[ingest]
analysis_long_side = 480
max_long_side = 1920
jpeg_quality = 95
motion_step = 0.035
max_gap_s = 0.75
max_frames = 1200
min_relative_sharpness = 0.6

[sfm]
feature_long_side = 1600
max_keypoints = 4096
detection_threshold = 0.005
sequential_window = 8
descriptor_model = "facebook/dinov2-base"
retrieval_top_k = 10
retrieval_min_similarity = 0.4
retrieval_min_gap = 12
retrieval_min_inliers = 60
retrieval_max_planar_fraction = 0.7
ransac_px = 2.0
min_inliers = 25
estimate_focal = true
loop_check = true
loop_max_rotation_deg = 10.0
camera_model = "OPENCV"
mapper = "global"
min_registered_fraction = 0.9
max_reprojection_px = 1.6
fisheye_fallback = true

[depth]
enabled = true
model = "depth-anything/Depth-Anything-V2-Small-hf"
downscale = 4
metric_model = "depth-anything/Depth-Anything-V2-Metric-Indoor-Base-hf"

[mvs]
enabled = true
sources = 6
min_angle_deg = 3.0
max_angle_deg = 40.0
planes = 128
window = 7
max_cost = 0.4
min_texture = 0.02
consistent_views = 2
reprojection_px = 1.0
relative_depth = 0.01

[audit]
enabled = true
long_side = 480
probe_cameras = 60
probe_yaw_deg = 30.0
probe_pitch_deg = 15.0
probe_shift = 0.25
max_unmeasured = 0.1
max_unrendered = 0.02
max_turn_deg = 12.0
max_psnr_drop = 2.0
max_weak_share = 0.25
sheet_views = 8
reslice = true
preview_steps = 5000
density = 3
max_extra_share = 0.5
min_inliers = 60
min_inlier_ratio = 0.35

[splat]
max_long_side = 1920
holdout_every = 8
steps = 30000
seed = 42
sh_degree = 3
sh_interval = 1000
ssim_weight = 0.2
resolution_schedule = [[0, 4], [1500, 2], [4000, 1]]
means_lr = 0.00016
means_lr_final = 1.6e-06
scales_lr = 0.005
quats_lr = 0.001
opacities_lr = 0.05
sh0_lr = 0.0025
shn_lr = 0.000125
opacity_regularization = 0.01
scale_regularization = 0.01
pose_refinement = true
pose_lr = 1e-05
pose_start_step = 1000
appearance = true
appearance_lr = 0.001
appearance_regularization = 0.001
depth_prior_weight = 0.3
depth_prior_weight_final = 0.03
normal_prior_weight = 0.1
textureless_gradient = 0.05
planar_prior = false
saturation_level = 0.98
depth_seed_points = 0
mvs_seed_points = 200000
gap_seed_points = 100000
needle_weight = 0.01
needle_ratio = 4.0
reflections = true
glass_reflectors = true
floor_reflector = false
reflect_lr = 0.05
random_background = false
rasterize_mode = "antialiased"
max_gaussians = 1500000
initial_opacity = 0.5
initial_scale = 0.5
noise_lr = 500000.0
refine_start = 500
refine_stop = 25000
refine_every = 100
min_opacity = 0.005
max_scale_fraction = 0.1
max_screen_fraction = 0.15
hard_view_share = 0.3
screen_keep_depth = 0.1
log_every = 200
evaluate_every = 10000
checkpoint_every = 5000

[partition]
max_images_per_block = 450
overlap = 0.15
finetune_steps = 10000

[fill]
enabled = true
model = "diffusers/stable-diffusion-xl-1.0-inpainting-0.1"
prompt = "a photo of the inside of a room, realistic, detailed, natural light"
negative_prompt = "blurry, distorted, text, watermark, people, cartoon"
yaw_steps = 12
pitches_deg = [-30.0, 0.0, 30.0]
field_of_view_deg = 75.0
probe_long_side = 768
min_support = 0.5
min_alpha = 0.9
large_hole = 0.01
support_angle_deg = 35.0
finetune_steps = 6000
pseudo_view_weight = 0.5

[tour]
width = 1920
height = 1080
fps = 30
supersample = 1.5
crf = 20
look_seconds = 14.0
look_radius = 0.4
max_unmeasured = 0.05
max_unrendered = 0.01
min_look_deg = 30.0
walk_seconds_per_metre = 1.2
check_every = 10

[demo]
width = 1920
height = 1080
fps = 30
supersample = 1.5
crf = 20
build_seconds = 24.0
clips = 8
clip_seconds = 4.5
walk_speed = 0.4
crossfade_seconds = 0.5
reel_fov_deg = 70.0
turns = false
turn_seconds = 12.0
