# Preview: living room + corridor segment (74.5–180 s) of the GLOMAP model, which has no mapping breaks there.
# Full 1080×1920 training after a coarse-to-fine warm-up; sized for a 16 GB A4000 that is
# also running other viewers.

[data]
downscale = 1
holdout_geometry_every = 8
holdout_exclusion_s = 0.0
time_range_s = [74.5, 180.0]

[training]
steps = 20000
sh_degree = 3
resolution_schedule = [[0, 4], [2000, 2], [6000, 1]]
pose_refinement = true
pose_start_step = 1000
appearance = true
evaluate_every = 10000
checkpoint_every = 5000

[refinement]
max_gaussians = 1500000
stop_step = 16000
