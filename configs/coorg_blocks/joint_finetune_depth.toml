# Joint fine-tune with a monocular depth prior (Depth Anything V2 Small) for blank ceilings and plain walls.
# image: no densification, full resolution and full SH from the start, small position lr.
# Removes floaters that one block left in another block's views.

[data]
downscale = 1

[training]
steps = 8000
sh_degree = 3
sh_interval = 1
resolution_schedule = [[0, 1]]
means_lr = 4e-5
means_lr_final = 1.6e-6
pose_start_step = 0
# Monocular depth prior (outputs of compute_mono_depth.py) for textureless surfaces.
depth_prior_weight = 0.05
evaluate_every = 100000
checkpoint_every = 2500

[refinement]
max_gaussians = 5000000
start_step = 100000
stop_step = 100000
