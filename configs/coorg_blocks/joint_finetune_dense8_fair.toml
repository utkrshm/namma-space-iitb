# Joint fine-tune of blocks/merged_finetune2 on the 8-per-second frame set (sfm_dense8, densify_sfm.py).
# image: no densification, full resolution and full SH from the start, small position lr.
# Removes floaters that one block left in another block's views.

[data]
downscale = 1
# Uses sfm_dense8_fair, where only *new* frames within 0.13 s of a held-out frame were removed,
# so training keeps exactly the 4-per-second frames plus extra frames away from held-out views.
holdout_exclusion_s = 0.0

[training]
steps = 12000
sh_degree = 3
sh_interval = 1
resolution_schedule = [[0, 1]]
means_lr = 4e-5
means_lr_final = 1.6e-6
pose_start_step = 0
evaluate_every = 100000
checkpoint_every = 2500

[refinement]
max_gaussians = 5000000
start_step = 100000
stop_step = 100000
