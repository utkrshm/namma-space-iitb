# Gaussian splatting from dense SfM cameras (src.splatting.sfm_training) for Coorg BnB.
# Full 1080×1920 training after a coarse-to-fine warm-up; sized for a 16 GB A4000 that is
# also running other viewers.

[data]
downscale = 1
holdout_geometry_every = 8
holdout_exclusion_s = 0.0

[training]
steps = 30000
sh_degree = 3
resolution_schedule = [[0, 4], [2000, 2], [6000, 1]]
pose_refinement = true
pose_start_step = 1000
appearance = true
evaluate_every = 10000
checkpoint_every = 5000

[refinement]
max_gaussians = 2500000
# Recycle near-transparent Gaussians: 69% sat between 0.005 and 0.02 opacity and added nothing.
min_opacity = 0.02
stop_step = 25000
